spring.application.name=sis_414_parcial
server.port=${PORT:8080}
server.address=0.0.0.0

spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
# Una sola documentación: /v3/api-docs (sin selector 01/02/03)
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vsiaf_evaluacion}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Para ejecutar datos ficticios localmente: spring.profiles.active=demo
#spring.profiles.active=demo
