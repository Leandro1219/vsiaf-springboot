# Perfil EXCLUSIVO para ensayar la evaluacion sobre una BD de prueba.
# Ejecutar con SPRING_PROFILES_ACTIVE=demo y DB_PASSWORD configurada.
# La base debe haberse creado previamente en PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vsiaf_evaluacion}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
